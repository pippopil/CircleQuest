<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#486B52"/>
      <stop offset="100%" stop-color="#2D4836"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Friendship Circle Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FAF8F3" stroke-width="18" stroke-dasharray="24 16" opacity="0.65"/>
  
  <!-- Core Sprout & Spark Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 256) scale(1.15) translate(-256, -256)">
    <!-- Central Node -->
    <circle cx="256" cy="256" r="48" fill="#FAF8F3"/>
    
    <!-- Leaves -->
    <path d="M256,220 C240,150 180,140 180,140 C180,140 190,200 240,230 Z" fill="#9BC4A5"/>
    <path d="M256,220 C272,150 332,140 332,140 C332,140 322,200 272,230 Z" fill="#C8E2CE"/>
    
    <!-- Spark / Compass star at the top -->
    <path d="M256,105 L263,125 L283,132 L263,139 L256,159 L249,139 L229,132 L249,125 Z" fill="#F4D35E"/>
    
    <!-- Orbit nodes (friends) -->
    <circle cx="160" cy="180" r="16" fill="#F4D35E"/>
    <circle cx="352" cy="180" r="16" fill="#FAF8F3"/>
    <circle cx="380" cy="290" r="16" fill="#9BC4A5"/>
    <circle cx="256" cy="380" r="16" fill="#FAF8F3"/>
    <circle cx="132" cy="290" r="16" fill="#C8E2CE"/>
  </g>
</svg>
