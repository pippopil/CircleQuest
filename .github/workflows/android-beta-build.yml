name: Android Beta Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Build Web App & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK (Debug / Beta)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew buildBetaApk --no-daemon
          cd ..

      - name: Package Web Bundle
        run: |
          cd dist
          zip -r ../circlequest-android-beta-build.zip .
          cd ..

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: circlequest-apk
          path: circlequest-v1.0.0-beta.1-build101.apk
          retention-days: 30

      - name: Upload Web PWA Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: circlequest-pwa-bundle
          path: circlequest-android-beta-build.zip
          retention-days: 14

      - name: Create GitHub Beta Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "CircleQuest Android Beta ${{ github.ref_name }} (Сборка #101) APK"
          body: |
            ## 📱 CircleQuest — Бета-релиз APK для Android

            - **Версия**: ${{ github.ref_name }}
            - **Номер сборки**: #101
            - **Файл установки**: `circlequest-v1.0.0-beta.1-build101.apk`
            - **Целевая платформа**: Android 7.0+ (API 24+)

            ### 🚀 Что включено:
            - **Полноценный APK-файл**: установка напрямую на любое Android-устройство.
            - **Квесты недели**: Синхронная утренняя разминка, добрые дела (с фотоотчетами без лиц) и Детокс-таймер тишины с дыхательной анимацией.
            - **Система поддержки «Искры»**: анти-лайки с мягким звуковым сопровождением (Web Audio API).
            - **Безопасность и защита детей**: 2-кликовая модерация, возрастной контроль (согласие родителей <14 лет), тихий режим для учебы и сна.

            ### 📲 Как установить APK на телефон:
            1. Скачайте прикрепленный файл `circlequest-v1.0.0-beta.1-build101.apk` на Android-смартфон.
            2. Нажмите на загруженный файл и подтвердите установку (разрешите установку из неизвестных источников в настройках безопасности при запросе системы).
            3. Запустите приложение CircleQuest с рабочего стола!
          files: |
            circlequest-v1.0.0-beta.1-build101.apk
            circlequest-android-beta-build.zip
          prerelease: true
